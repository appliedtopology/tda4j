name: Coverage

# Statement and branch coverage of the test suite, as a map of what the specs never exercise, not a gate: no threshold
# fails it. Weekly and on demand only, since instrumentation makes the test run slower; the HTML report is uploaded as
# an artifact and the least-covered files are listed in the run's summary. The same command runs locally,
# then `sbt shutdown` and `sbt clean`: instrumented classes must not reach a jar or the docs. The disk cache
# is turned off for the run because sbt 2 restores instrumented classes from it without the scoverage-data directory
# they write to, and every instrumented call then fails with FileNotFoundException (seen on a second local run).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Run the tests with coverage
        run: sbt "set Global / cacheStores := Nil ; clean ; coverage ; testFull ; coverageReport"
      - name: Summarize
        run: |
          report=$(ls -d target/out/jvm/scala-*/tda4j/scoverage-report)
          python3 - "$report/scoverage.xml" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print(f"Statement coverage {float(root.get('statement-rate')):.1f}%, "
                f"branch coverage {float(root.get('branch-rate')):.1f}%\n")
          files = {}
          for cls in root.iter('class'):
              counts = files.setdefault(cls.get('filename').split('/tda4j/')[-1], [0, 0])
              counts[0] += int(cls.get('statement-count'))
              counts[1] += int(cls.get('statements-invoked'))
          print("| least covered (40+ statements) | covered | statements |\n|---|---|---|")
          rows = sorted((inv / n, n, name) for name, (n, inv) in files.items() if n >= 40)
          for rate, n, name in rows[:20]:
              print(f"| `{name}` | {rate * 100:.1f}% | {n} |")
          EOF
      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: scoverage-report
          path: target/out/jvm/scala-*/tda4j/scoverage-report
