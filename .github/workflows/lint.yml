name: Lint

on:
  push:
    branches:
      - scala
  pull_request:
    branches:
      - scala

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Formatting
        run: ./mill --no-server --disable-ticker mill.scalalib.scalafmt/checkFormatAll