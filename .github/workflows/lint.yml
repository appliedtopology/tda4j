name: Lint

on:
  push:
    paths-ignore:
      - '.github/**'
      - '.claude/**'
    branches:
      - scala
  # No `paths-ignore` on pull_request (nor `merge_group`, which takes none): a path-filtered required check never
  # reports and blocks the merge; the `changes` job below skips the build jobs instead.
  pull_request:
    branches:
      - scala
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's still-running lint; a push to `scala` itself is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the build jobs below run. A job skipped by `if` reports as passed, so a required check never hangs
  # the way it does under a workflow-level `paths-ignore`; a PR that only touches `.github/` or `.claude/` skips the
  # build, a merge-queue batch and a push always run it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && \
             ! git diff --name-only "origin/$BASE...HEAD" | grep -qvE '^(\.github|\.claude)/'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      # One sbt launch, stops at the first failure (a single quoted `;` string, so the same line works locally, where sbt 2's thin
      # client re-joins separate arguments and loses the quotes around `Test / scalafmtCheck`): the build files (`build.sbt`), the
      # main sources, and the test sources. `--server` runs sbt in the foreground (test.yml's header says why).
      # Fix locally with `sbt scalafmtAll scalafmtSbt`.
      - name: Formatting
        run: sbt --server "scalafmtSbtCheck ; scalafmtCheck ; Test / scalafmtCheck"

  # A pull request's changelog entry is a file in changelog.d/ (changelog.d/README.md), not a line of CHANGELOG.md: two pull
  # requests that add to the same list conflict, and the merge queue drops the second. No build, so it runs on every pull
  # request, queue batch and push, whatever the paths, and `changes` does not gate it.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fragments are well-formed
        run: python3 changelog.d/assemble.py check
      - name: The release script
        run: python3 -m unittest discover -s changelog.d
      - name: The pull request adds no entry to CHANGELOG.md
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: python3 changelog.d/assemble.py check --base "origin/$BASE"
