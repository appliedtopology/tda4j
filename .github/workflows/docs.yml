name: Docs

on:
  push:
    branches:
      - scala

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/gh-pages' && github.ref != 'gh-pages'
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Build docs site
        run: sbt laikaSite
      # Publishes with plain git against a `gh-pages` worktree, not a plugin. `sbt-github-pages` (removed --
      # see git history and .claude/WORKLOG-docs-publish-performance.md) pushed via the GitHub Data API: one
      # `createBlob` HTTP call per file, with a hardcoded 1-second sleep before each to dodge GitHub's own
      # secondary rate limit, no batching at all. For ~1000 files (this build's own scaladoc output alone is
      # most of that) that measured at 21+ minutes for this one step -- confirmed from the actual job log, not
      # guessed: a single unbroken silent gap of 1268s between "about to add this file" and "pushed" -- and it
      # can only get slower as more release versions accumulate. Native git hashes/writes objects locally and
      # pushes once; the same operation is seconds regardless of file count.
      #
      # `laikaSite`'s own output (target/docs/site) is NOT version-prefixed (laikaConfig's Versions value only
      # drives the version-switcher dropdown/laika/versionInfo.json, not physical output placement -- confirmed
      # by inspecting a real build's output), so this step's job is to place it at its own path (`dev/` here;
      # release.yml does the equivalent under the tag's own version) directly inside a checkout of the real
      # gh-pages history -- editing in place, not staging a merged copy into a scratch directory first -- so
      # every other already-published version, and root files like .nojekyll/CNAME, are left untouched by
      # construction rather than by a "copy forward what's not already here" loop.
      - name: Publish docs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -b gh-pages /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages
            git -C /tmp/gh-pages checkout --orphan gh-pages
            git -C /tmp/gh-pages rm -rf . > /dev/null 2>&1 || true
            touch /tmp/gh-pages/.nojekyll
          fi
          rm -rf /tmp/gh-pages/dev
          cp -r target/docs/site /tmp/gh-pages/dev
          # Root redirects to the newest released version if one has been published, else to "dev". Matches
          # only directory names that look like a real release version (digits/dots), not merely "not dev" --
          # a plain exclusion list here previously let stale non-version directories (leftover from before docs
          # versioning existed, never cleaned up because the old plugin could never delete remote-only content)
          # win a `sort -V` comparison and become the redirect target: this is not hypothetical, it's what the
          # site's root was actually doing (confirmed: redirected to "user-guide/") before this fix.
          LATEST=$(cd /tmp/gh-pages && find . -maxdepth 1 -type d -name '[0-9]*.[0-9]*.[0-9]*' -printf '%f\n' | sort -V | tail -n1)
          TARGET="${LATEST:-dev}/"
          printf '<!DOCTYPE html><meta charset="utf-8"><title>TDA4j docs</title><meta http-equiv="refresh" content="0; url=%s"><a href="%s">TDA4j docs</a>' "$TARGET" "$TARGET" > /tmp/gh-pages/index.html
          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Updating webpages."
            git push origin HEAD:gh-pages
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/gh-pages --force
