name: Docs

on:
  push:
    branches:
      - scala

# Shared with release.yml on purpose -- see its own copy of this comment for why.
concurrency:
  group: gh-pages-publish

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/gh-pages' && github.ref != 'gh-pages'
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Build docs site
        run: sbt doc
      - name: Publish docs
        env:
          # Repo Settings -> Secrets and variables -> Actions -> Variables. When set (e.g. to "dev"), pins
          # root's redirect to this verbatim, ahead of the sort -V-based auto-detection below -- for
          # pinning root to "dev" while the latest tagged release's own published snapshot is known-broken,
          # without giving up the auto-latest-stable-wins behavior for whenever a real fix is published.
          # Clear the variable (empty/unset) to resume automatic detection. See
          # .claude/WORKLOG-docs-site-fixes.md.
          DOCS_DEFAULT_VERSION: ${{ vars.DOCS_DEFAULT_VERSION }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -b gh-pages /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages
            git -C /tmp/gh-pages checkout --orphan gh-pages
            git -C /tmp/gh-pages rm -rf . > /dev/null 2>&1 || true
            touch /tmp/gh-pages/.nojekyll
          fi
          rm -rf /tmp/gh-pages/dev
          ls target/
          ls target/out
          ls target/out/jvm 
          ls target/out/jvm/scala-3.9.0
          cp -r target/out/jvm/scala-3.9.0/api /tmp/gh-pages/dev
          # Root redirects to the newest released version if one has been published, else to "dev". Matches
          # only directory names that look like a real release version (digits/dots), not merely "not dev" --
          # a plain exclusion list here previously let stale non-version directories (leftover from before docs
          # versioning existed, never cleaned up because the old plugin could never delete remote-only content)
          # win a `sort -V` comparison and become the redirect target: this is not hypothetical, it's what the
          # site's root was actually doing (confirmed: redirected to "user-guide/") before this fix.
          if [ -n "$DOCS_DEFAULT_VERSION" ]; then
            TARGET="${DOCS_DEFAULT_VERSION}/"
          else
            LATEST=$(cd /tmp/gh-pages && find . -maxdepth 1 -type d -name '[0-9]*.[0-9]*.[0-9]*' -printf '%f\n' | sort -V | tail -n1)
            TARGET="${LATEST:-dev}/"
          fi
          printf '<!DOCTYPE html><meta charset="utf-8"><title>TDA4j docs</title><meta http-equiv="refresh" content="0; url=%s"><a href="%s">TDA4j docs</a>' "$TARGET" "$TARGET" > /tmp/gh-pages/index.html
          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Updating webpages."
            git push origin HEAD:gh-pages
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/gh-pages --force
