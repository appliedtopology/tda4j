name: Release

# Runs on a `vX.Y.Z` tag push -- which `sbt release` (see RELEASE.md) creates and pushes itself as part of
# its own `tagRelease`/`pushChanges` steps. This workflow does NOT publish to Maven Central: `sbt release`
# already does that locally (publishSigned/sonaUpload/sonaRelease), and re-running those here would be a
# duplicate publish attempt against an already-released coordinate. This workflow only covers what `sbt
# release` doesn't: building the fat jar, attaching every release artifact to a GitHub Release, and
# publishing that version's docs snapshot under its own path on GitHub Pages.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish"
        required: true
  push:
    tags:
      - "v*"

# Shared with docs.yml on purpose: both workflows publish to the gh-pages branch via a plain fetch/commit/push
# sequence with no merge logic, so two overlapping runs (a docs.yml push-to-scala run and a release.yml tag or
# workflow_dispatch run, or two of either) can race and have one push rejected ("fetch first") -- confirmed for
# real, not hypothetical. Same group name in both files means GitHub queues the second run instead of racing it.
concurrency:
  group: gh-pages-publish

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Derive release version
        id: version
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts
        env:
          TDA4J_DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: sbt assembly packageSrc packageDoc laikaSite
      # Same rationale as docs.yml's own step of the same name (see there, and
      # .claude/WORKLOG-docs-publish-performance.md, for why this no longer goes through sbt-github-pages):
      # `laikaSite`'s output isn't version-prefixed on its own, so this step's job is to place it at its own
      # version path directly inside a checkout of the real gh-pages history -- editing in place, not staging
      # a merged copy into a scratch directory first -- so every other already-published version (including
      # "dev"), and root files like .nojekyll/CNAME, are left untouched by construction.
      - name: Publish versioned docs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -b gh-pages /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages
            git -C /tmp/gh-pages checkout --orphan gh-pages
            git -C /tmp/gh-pages rm -rf . > /dev/null 2>&1 || true
            touch /tmp/gh-pages/.nojekyll
          fi
          rm -rf "/tmp/gh-pages/$VERSION"
          cp -r target/docs/site "/tmp/gh-pages/$VERSION"
          # Root redirects to the newest released version. Matches only directory names that look like a real
          # release version (digits/dots), not merely "not dev" -- see docs.yml's own copy of this step for
          # why a plain exclusion list is a real, already-observed bug (a stale non-version leftover directory
          # winning a `sort -V` comparison and becoming the redirect target).
          LATEST=$(cd /tmp/gh-pages && find . -maxdepth 1 -type d -name '[0-9]*.[0-9]*.[0-9]*' -printf '%f\n' | sort -V | tail -n1)
          TARGET="${LATEST:-dev}/"
          printf '<!DOCTYPE html><meta charset="utf-8"><title>TDA4j docs</title><meta http-equiv="refresh" content="0; url=%s"><a href="%s">TDA4j docs</a>' "$TARGET" "$TARGET" > /tmp/gh-pages/index.html
          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish docs for ${{ github.ref_name }}"
            git push origin HEAD:gh-pages
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/gh-pages --force
      - name: Zip docs snapshot
        run: |
          (cd "target/docs/site" && zip -rq "$GITHUB_WORKSPACE/docs-${{ steps.version.outputs.version }}.zip" .)
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Pre-1.0 releases are marked as GitHub pre-releases; drop this once the library reaches 1.0.0.
          PRERELEASE_FLAG=""
          case "$VERSION" in
            0.*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # A `*` prefix, not a hardcoded `TDA4j`/`tda4j`: these filenames come from `name.value`
          # (`assemblyJarName`) and `moduleName.value` (packageSrc/packageDoc's own defaults, which lowercase
          # regardless of what `name :=` says) respectively -- two different sbt conventions that don't
          # necessarily agree in case with each other or with `name`. Confirmed broken once for real: v0.4.0's
          # own run failed here after `name := "TDA4j"` became `name := "tda4j"` (matching the actual Maven
          # coordinate), because this glob still hardcoded the old capitalization.
          gh release create "${{ github.ref_name }}" \
            --title "TDA4j ${VERSION}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            target/scala-3.9.0/*-${VERSION}-assembly.jar \
            target/scala-3.9.0/*-sources.jar \
            target/scala-3.9.0/*-javadoc.jar \
            "docs-${VERSION}.zip"
