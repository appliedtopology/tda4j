name: Release

# Runs on a `vX.Y.Z` tag push -- which `sbt release` (see RELEASE.md) creates and pushes itself as part of
# its own `tagRelease`/`pushChanges` steps. This workflow does NOT publish to Maven Central: `sbt release`
# already does that locally (publishSigned/sonaUpload/sonaRelease), and re-running those here would be a
# duplicate publish attempt against an already-released coordinate. This workflow only covers what `sbt
# release` doesn't: building the fat jar, the demo REPL jar, the npm package and the Python wheel, attaching every release artifact to a
# GitHub Release, publishing that version's docs snapshot under its own path on GitHub Pages, and publishing the npm package
# and (once it is set up) the Python package. `sbt release` publishes both Maven artifacts, `tda4j_3` (JVM)
# and `tda4j_sjs1_3` (Scala.js).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish"
        required: true
  # Tags only, never branches: the version is derived from the ref name, so a branch push would publish docs under
  # gh-pages/<branch>/ and try to create a GitHub Release (and tag) named after the branch. docs.yml already
  # republishes the site on every push to `scala`.
  push:
    paths-ignore:
      - '.github/**'
      - '.claude/**'
    tags:
      - "v*"

# Shared with docs.yml on purpose: both workflows publish to the gh-pages branch via a plain fetch/commit/push
# sequence with no merge logic, so two overlapping runs (a docs.yml push-to-scala run and a release.yml tag or
# workflow_dispatch run, or two of either) can race and have one push rejected ("fetch first") -- confirmed for
# real, not hypothetical. Same group name in both files means GitHub queues the second run instead of racing it.
concurrency:
  group: gh-pages-publish

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # An npm access token that may publish to the `@appliedtopology` scope (RELEASE.md, "npm"). Without it the publish step is skipped, and
      # the package is still built and attached to the GitHub Release.
      SCALA_BUILD_VERSION: 3.9.0
      SCALA_DOCS_VERSION: 3.8.4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Derive release version
        id: version
        run: |
          # The release tag: the dispatch input on a manual run, else the pushed tag. Never `github.ref_name` alone: on a
          # manual run that is the BRANCH the run was started from, and `gh release create <branch>` would create a tag
          # named after the branch.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # Fail here, before anything is pushed to gh-pages, if the ref is not an existing release tag.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::'$TAG' is not a release version (expected a vX.Y.Z tag)"; exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag '$TAG' does not exist"; exit 1
          fi
          # Require that the tag's commit is reachable from the `scala` branch before releasing.
          git fetch origin scala
          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/scala"; then
            echo "::error::tag '$TAG' is not on the scala branch (commit not reachable from origin/scala)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts
        env:
          TDA4J_DOCS_VERSION: ${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Docs only are built with 3.8.4 (see build.sbt), switched to with `++3.8.4!` inside ONE sbt invocation: one
          # project load, and it does not depend on how sbt is started. A second `TDA4J_SCALA_VERSION=3.8.4 sbt ...` call
          # sees the variable only in a fresh sbt JVM; through sbt 2's thin client it would join the server the first call
          # started, build docs with 3.9.0, and leave no scala-3.8.4/.../api for the steps below. TODO: drop `++3.8.4!` when
          # 3.9.1 is released.
          #
          # `--server` here and in the next step runs sbt in the foreground, so no sbt server is left to race setup-sbt's
          # post-job cache step (test.yml's header says why).
          #
          # `publishLocal` (still on 3.9.0, before the switch) puts this checkout's library into ~/.ivy2/local for the demo jar
          # below, which depends on a VERSION of the library: building it against the tag's own sources does not wait for
          # Maven Central to serve the version `sbt release` has just published. `packageDoc` below builds the scaladoc jar
          # the release carries, with 3.8.4.
          #
          # The first command pins the build's version to the tag's. `sbt release` tags the commit that set `version.sbt` to
          # the release version, so on a real release this changes nothing; a tag made by hand on a commit that still says
          # `-SNAPSHOT` (a trial run of this workflow, say) would otherwise publish `tda4j_3` as `X.Y.Z-SNAPSHOT` while the
          # demo build asks ~/.ivy2/local for `X.Y.Z`, and name the assembly jar and the npm package after the snapshot, so
          # that the `gh release create` globs below match nothing and `npm publish` would publish the snapshot version.
          #
          # Every command names its project: `tda4j` is the JVM build (fat jar, docs, the JVM Maven artifact), `tda4jJS` the
          # Scala.js build (the npm package).
          sbt --server "set ThisBuild / version := \"$VERSION\" ; tda4j/assembly ; tda4j/publishLocal ; tda4j/packageSrc ; tda4jJS/npmPack ; ++3.8.4! ; tda4j/packageDoc ; tda4j/doc"
      - name: Build the Python wheel
        # The wheel carries the fat jar built above and the release's version as a PEP 440 version (python/scripts/set_version.py).
        # Installed into an empty environment and run, as test.yml's `python-package` job does for every pull request.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          python -m pip install build
          python/scripts/bundle-jar.sh "$(ls target/out/jvm/scala-3.9.0/tda4j/*-${VERSION}-assembly.jar)"
          python python/scripts/set_version.py "$VERSION"
          python -m build --wheel python
          python -m venv /tmp/py-release
          /tmp/py-release/bin/pip install python/dist/*.whl
          /tmp/py-release/bin/python - <<'PY'
          import numpy as np, tda4j
          bars = tda4j.persistence(np.array([[0, 0], [1, 0], [1, 1], [0, 1.0]]), max_dimension=1).bars
          loops = int((bars[:, 0] == 1).sum())
          assert loops == 1, f"expected one loop in the unit square, got {loops}"
          print("python wheel ok:", len(bars), "bars")
          PY
      - name: Build the demo REPL jar
        # A separate sbt build (demo/README.md), in its own fresh sbt JVM, which sees the env var below. It resolves
        # `tda4j % VERSION` from ~/.ivy2/local, where the step above just put it, and everything else from Maven Central.
        #
        # The sbt disk cache is switched off for this build. setup-sbt restores ~/.cache/sbt from an earlier run, and
        # sbt 2 then handed back the `assembly` jar of that run (`tda4j-demo-0.6.2.jar`, with that library inside) for
        # `TDA4J_VERSION=0.7.0-preview`, so the smoke test below found no jar of the tag's name. `demo/build.sbt` says the same
        # thing for the build; it is repeated here because a dispatch of this workflow builds the sources of the TAG,
        # and an older tag has a `demo/build.sbt` without it.
        working-directory: demo
        env:
          TDA4J_VERSION: ${{ steps.version.outputs.version }}
        run: sbt --server "set Global / cacheStores := Nil ; ++3.9.0! ; assembly"
      - name: Smoke-test the demo REPL jar
        # Checks the answer, not just the exit code: a REPL that starts and cannot run the library would still exit 0. The
        # REPL evaluates the first piped line and ends, so the script is run with `:load`. The unit square has five bars,
        # one of degree 1.
        run: |
          jar="demo/target/out/jvm/scala-3.9.0/tda4j-demo/tda4j-demo-${{ steps.version.outputs.version }}.jar"
          test -f "$jar" || { echo "::error::$jar was not built"; exit 1; }
          cat > /tmp/demo-smoke.scala <<'SCALA'
          val d = Persistence(Array(Array(0.0, 0.0), Array(1.0, 0.0), Array(1.0, 1.0), Array(0.0, 1.0)))
          println("demo-smoke: bars=" + d.bars.size + " h1=" + d.bars.count(_.dim == 1))
          SCALA
          out=$(echo ":load /tmp/demo-smoke.scala" | timeout 300 java -jar "$jar" 2>&1)
          echo "$out" | tail -5
          echo "$out" | grep -q "demo-smoke: bars=5 h1=1" || { echo "::error::the demo jar did not compute the expected barcode"; exit 1; }
      - name: Publish versioned docs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -b gh-pages /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages
            git -C /tmp/gh-pages checkout --orphan gh-pages
            git -C /tmp/gh-pages rm -rf . > /dev/null 2>&1 || true
            touch /tmp/gh-pages/.nojekyll
          fi
          cp -r target/out/jvm/scala-3.8.4/tda4j/api "/tmp/gh-pages/$VERSION" # TODO: 3.9.0 when the docs pin is removed
          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish docs for ${{ steps.version.outputs.tag }}"
            git push origin HEAD:gh-pages
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/gh-pages --force
      - name: Zip docs snapshot
        run: | # TODO: Change when 3.9.1 comes out
          (cd "target/out/jvm/scala-3.8.4/tda4j/api" && zip -rq "$GITHUB_WORKSPACE/docs-${{ steps.version.outputs.version }}.zip" .)
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Pre-1.0 releases are marked as GitHub pre-releases; drop this once the library reaches 1.0.0.
          PRERELEASE_FLAG=""
          case "$VERSION" in
            0.*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # A `*` prefix, not a hardcoded `TDA4j`/`tda4j`: these filenames come from `name.value`
          # (`assemblyJarName`) and `moduleName.value` (packageSrc/packageDoc's own defaults, which lowercase
          # regardless of what `name :=` says) respectively -- two different sbt conventions that don't
          # necessarily agree in case with each other or with `name`. Confirmed broken once for real: v0.4.0's
          # own run failed here after `name := "TDA4j"` became `name := "tda4j"` (matching the actual Maven
          # coordinate), because this glob still hardcoded the old capitalization.
          gh release create "${{ steps.version.outputs.tag }}" --verify-tag \
            --title "TDA4j ${VERSION}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            target/out/jvm/scala-3.9.0/tda4j/*-${VERSION}-assembly.jar \
            target/out/jvm/scala-3.9.0/tda4j/*-sources.jar \
            target/out/jvm/scala-3.8.4/tda4j/*-javadoc.jar \
            target/npm/*.tgz \
            python/dist/*.whl \
            "demo/target/out/jvm/scala-3.9.0/tda4j-demo/tda4j-demo-${VERSION}.jar" \
            "docs-${VERSION}.zip"
      - name: Publish to npm
        # npm setup with Trusted Publisher, checks that this is in a run of `release.yml` to allow publishing
        # Hence, NPM_TOKEN is no longer required.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          TAG_FLAG=""
          case "$VERSION" in
            *-*) TAG_FLAG="--tag next" ;;
          esac
          npm publish target/npm/*.tgz --access public $TAG_FLAG
      - name: Publish to PyPI
        # PyPI Trusted Publishing (no token): a pending publisher for this repository and workflow, set up once on pypi.org
        # (RELEASE.md, "PyPI"). The step is skipped until the repository variable PUBLISH_TO_PYPI is `true`, so a release
        # made before that setup still succeeds and attaches the wheel to the GitHub Release.
        if: vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
