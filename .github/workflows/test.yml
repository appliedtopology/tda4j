name: Test

on:
  push:
    branches:
      - scala
  pull_request:
    branches:
      - scala
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's still-running checks; a push to `scala` itself is never cancelled,
# so every commit on `scala` keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three independent jobs (they run in parallel, and each shows up as its own check on a pull request): `test`, `docs`
# and `mima`. A branch rule for `scala` can require any of them by job name.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Run tests
        run: sbt "clean ; test"

  # Compiles every Scala fence in `_docs`. The tutorial specs run the same fences inside `test`; this job is what catches a
  # broken fence in a page that has no spec, and a broken site build.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Build docs
        env:
          TDA4J_SCALA_VERSION: "3.8.4" # docs only; see build.sbt. TODO: remove when 3.9.1 is released.
        run: sbt doc

  # NB: `mimaPreviousArtifacts` is read from git tags (see build.sbt), and this shallow checkout has none, so the check
  # currently compares against nothing. Fetching tags would compare 0.5.0 against 0.4.x, which 0.5.0 deliberately breaks.
  mima:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Binary Compatibility Checks
        run: sbt mimaReportBinaryIssues
