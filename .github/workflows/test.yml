name: Test

on:
  push:
    paths-ignore:
      - '.github/**'
      - '.claude/**'
    branches:
      - scala
  # No `paths-ignore` on pull_request (nor `merge_group`, which takes none): a path-filtered required check never
  # reports and blocks the merge; the `changes` job below skips the build jobs instead.
  pull_request:
    branches:
      - scala
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's still-running checks; a push to `scala` itself is never cancelled,
# so every commit on `scala` keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Six independent jobs (they run in parallel, and each shows up as its own check on a pull request): `test` (the JVM
# build), `test-js` (the Scala.js build, on Node.js), `npm-package` (the npm tarball, installed and run),
# `python-package` (the Python wheel, installed and tested), `docs-build` (named to differ from the deploying job `docs`
# in docs.yml) and `mima`. A branch rule for `scala` can require any of
# them by job name. The sbt projects are `tda4j` (JVM) and `tda4jJS` (Scala.js): every command here names one.
#
# Every sbt call in every workflow runs with `--server`: sbt in the foreground, finished when its step is. Through sbt
# 2's default thin client a server stays behind, and in the first milliseconds after the step it replaces its log file
# in `target/global-logging/`, just as setup-sbt's post-job cache step hashes the workspace (`hashFiles('**/*.sbt',
# '**/*.properties')`); a file deleted under that walk fails the job ("Post Setup sbt launcher") after every step passed.
# A new sbt step keeps the flag.
jobs:
  # Decides whether the build jobs below run. A job skipped by `if` reports as passed, so a required check never hangs
  # the way it does under a workflow-level `paths-ignore`; a PR that only touches `.github/` or `.claude/` skips the
  # build, a merge-queue batch and a push always run it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && \
             ! git diff --name-only "origin/$BASE...HEAD" | grep -qvE '^(\.github|\.claude)/'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Run tests
        run: sbt --server "clean ; tda4j/test"
      # The fat jar is what the CLI and MATLAB users run; release.yml builds it, so a break (a merge strategy, a missing
      # main class) would otherwise surface only at release. The smoke run checks the answer, not just the exit code:
      # the noisy circle has exactly one degree-1 bar.
      - name: Build the fat jar
        run: sbt --server tda4j/assembly
      - name: Smoke-test the fat jar
        run: |
          jar=$(ls target/out/jvm/scala-*/tda4j/tda4j-*-assembly.jar)
          java -jar "$jar" --help > /dev/null
          bars=$(java -jar "$jar" --max-dimension 1 _docs/tutorials/data/noisy-circle.csv | grep -c '^1:')
          test "$bars" = 1 || { echo "expected one degree-1 bar on the noisy circle, got $bars"; exit 1; }

  # The Scala.js build: the specs that live in `src/test/scala` run on Node.js, linked as ES modules (`tda4jJS/test`).
  # Node 22 because the file access reads `process.getBuiltinModule` (Node 20.16 and newer have it). A spec that needs
  # a JVM (files, the live viewer, benchmarks) is in `src/test/scalajvm` and does not run here.
  test-js:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Run the Scala.js tests
        run: sbt --server "clean ; tda4jJS/test"

  # The npm package the release attaches (and publishes to npm once a token is configured, see release.yml): built from
  # the optimized link, installed from its tarball into an empty project, and run the way a user runs it, as a library
  # (`import { persistence } from "@appliedtopology/tda4j"`) and as the command (`npx tda4j`). The unit square has one loop.
  npm-package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Build the package
        run: sbt --server tda4jJS/npmPack
      - name: Install and run it
        run: |
          set -e
          tarball=$(ls "$PWD"/target/npm/*.tgz)
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$tarball"
          cat > check.mjs <<'JS'
          import { persistence } from "@appliedtopology/tda4j";
          const result = persistence([[0, 0], [1, 0], [1, 1], [0, 1]], { maxDimension: 1 });
          const loops = result.bars.filter((bar) => bar.dim === 1).length;
          if (loops !== 1) { console.error("expected one loop in the unit square, got " + loops); process.exit(1); }
          console.log("library ok: " + result.bars.length + " bars, " + loops + " loop");
          JS
          node check.mjs
          printf '0,0\n1,0\n1,1\n0,1\n' > square.csv
          bars=$(npx tda4j --max-dimension 1 square.csv | grep -c '^1:')
          test "$bars" = 1 || { echo "expected one degree-1 bar from the command, got $bars"; exit 1; }

  # The Python package the release attaches (and publishes to PyPI once that is set up, see release.yml and RELEASE.md): the
  # wheel built around the fat jar, installed into clean virtual environments on the oldest and the newest Python it
  # supports and tested from outside the checkout, so the tests import the installed package and its bundled jar, not
  # the sources next to them. The tests are `python/tests`; the ones that need the checkout (the release script, and the
  # documentation's Python examples, `test_docs.py`) skip themselves there and run in the last step, on the sources.
  python-package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the fat jar and the wheel
        run: |
          set -e
          sbt --server tda4j/assembly
          python -m pip install build
          python/scripts/bundle-jar.sh
          python -m build --wheel python
      - name: Test the wheel on Python 3.13
        run: |
          set -e
          python -m venv "$RUNNER_TEMP/py313"
          "$RUNNER_TEMP/py313/bin/pip" install python/dist/*.whl pytest
          cp -r python/tests "$RUNNER_TEMP/py-tests"
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/py313/bin/python" -m pytest py-tests -q
      - name: Setup Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Test the wheel on Python 3.10
        run: |
          set -e
          python -m venv "$RUNNER_TEMP/py310"
          "$RUNNER_TEMP/py310/bin/pip" install python/dist/*.whl pytest
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/py310/bin/python" -m pytest py-tests -q
      - name: Run the tests that need the checkout (release script, the documentation's Python examples)
        run: |
          python -m pip install pytest numpy jpype1
          PYTHONPATH="$PWD/python/src" TDA4J_JAR=$(ls "$PWD"/python/src/tda4j/jars/*-assembly.jar) python -m pytest python/tests/test_release_scripts.py python/tests/test_docs.py -q

  # Compiles every Scala fence in `_docs`. The tutorial specs run the same fences inside `test`; this job is what catches a
  # broken fence in a page that has no spec, and a broken site build.
  docs-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Build docs
        env:
          TDA4J_SCALA_VERSION: "3.8.4" # docs only; see build.sbt. TODO: remove when 3.9.1 is released.
        run: sbt --server tda4j/doc

  # Binary compatibility is enforced within a compatibility series (0.Y.x before 1.0, then X.x) and never across one;
  # `build.sbt` (`mimaBaselineVersions`) derives the baseline from the `v*` git tags, so this job needs the full history
  # and tags. A build with no earlier plain release in its series (an X.Y.0-SNAPSHOT, like 0.7.0-SNAPSHOT now) has an
  # empty baseline, and the job passes trivially ("mimaPreviousArtifacts is empty").
  mima:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the MiMa baseline is read from git tags
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Binary Compatibility Checks
        run: sbt --server tda4j/mimaReportBinaryIssues
