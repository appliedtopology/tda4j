name: Test

on:
  push:
    branches:
      - scala
  pull_request:
    branches:
      - scala
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's still-running checks; a push to `scala` itself is never cancelled,
# so every commit on `scala` keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Five independent jobs (they run in parallel, and each shows up as its own check on a pull request): `test` (the JVM
# build), `test-js` (the Scala.js build, on Node.js), `npm-package` (the npm tarball, installed and run), `docs-build`
# (named to differ from the deploying job `docs` in docs.yml) and `mima`. A branch rule for `scala` can require any of
# them by job name. The sbt projects are `tda4j` (JVM) and `tda4jJS` (Scala.js): every command here names one.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Run tests
        run: sbt "clean ; tda4j/test"
      # The fat jar is what the CLI and MATLAB users run; release.yml builds it, so a break (a merge strategy, a missing
      # main class) would otherwise surface only at release. The smoke run checks the answer, not just the exit code:
      # the noisy circle has exactly one degree-1 bar.
      - name: Build the fat jar
        run: sbt tda4j/assembly
      - name: Smoke-test the fat jar
        run: |
          jar=$(ls target/out/jvm/scala-*/tda4j/tda4j-*-assembly.jar)
          java -jar "$jar" --help > /dev/null
          bars=$(java -jar "$jar" --max-dimension 1 _docs/tutorials/data/noisy-circle.csv | grep -c '^1:')
          test "$bars" = 1 || { echo "expected one degree-1 bar on the noisy circle, got $bars"; exit 1; }

  # The Scala.js build: the specs that live in `src/test/scala` run on Node.js, linked as ES modules (`tda4jJS/test`).
  # Node 22 because the file access reads `process.getBuiltinModule` (Node 20.16 and newer have it). A spec that needs
  # a JVM (files, the live viewer, benchmarks) is in `src/test/scalajvm` and does not run here.
  test-js:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Run the Scala.js tests
        run: sbt "clean ; tda4jJS/test"

  # The npm package the release attaches (and publishes to npm once a token is configured, see release.yml): built from
  # the optimized link, installed from its tarball into an empty project, and run the way a user runs it, as a library
  # (`import { persistence } from "tda4j"`) and as the command (`npx tda4j`). The unit square has one loop.
  npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Build the package
        run: sbt tda4jJS/npmPack
      - name: Install and run it
        run: |
          set -e
          tarball=$(ls "$PWD"/target/npm/*.tgz)
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$tarball"
          cat > check.mjs <<'JS'
          import { persistence } from "tda4j";
          const result = persistence([[0, 0], [1, 0], [1, 1], [0, 1]], { maxDimension: 1 });
          const loops = result.bars.filter((bar) => bar.dim === 1).length;
          if (loops !== 1) { console.error("expected one loop in the unit square, got " + loops); process.exit(1); }
          console.log("library ok: " + result.bars.length + " bars, " + loops + " loop");
          JS
          node check.mjs
          printf '0,0\n1,0\n1,1\n0,1\n' > square.csv
          bars=$(npx tda4j --max-dimension 1 square.csv | grep -c '^1:')
          test "$bars" = 1 || { echo "expected one degree-1 bar from the command, got $bars"; exit 1; }

  # Compiles every Scala fence in `_docs`. The tutorial specs run the same fences inside `test`; this job is what catches a
  # broken fence in a page that has no spec, and a broken site build.
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Build docs
        env:
          TDA4J_SCALA_VERSION: "3.8.4" # docs only; see build.sbt. TODO: remove when 3.9.1 is released.
        run: sbt tda4j/doc

  # Binary compatibility is enforced within a compatibility series (0.5.x, later 1.x) and never across one; `build.sbt`
  # (`mimaBaselineVersions`) derives the baseline from the `v*` git tags, so this job needs the full history and tags.
  # While only 0.5.0-SNAPSHOT exists the baseline is empty and the job passes trivially.
  mima:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the MiMa baseline is read from git tags
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Binary Compatibility Checks
        run: sbt tda4j/mimaReportBinaryIssues
