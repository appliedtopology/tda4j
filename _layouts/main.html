<style>
     :root {
          /* text */
          --text-primary: #205976;
          --text-secondary: #866504;
          --text-text-tertiary: #206f6f;
          --text-text-inverted: #eef3f5;

          /* background */
          --background-default: #f8f7f4;
          --background-subtle: var(--grey2);
          --background-neutral: var(--grey3);
     }
     :root.theme-dark {

          /* text */
          --text-primary: #81bde0;
          --text-secondary: #f0c647;
          --text-text-tertiary: #75c7c7;
          --text-text-inverted: #1a262b;

          /* background */
          --background-default: #161b1e;
          --background-subtle: var(--grey2);
          --background-neutral: var(--grey3);


     }
     :is(#content h1, h2, h3, h4, h5, h6, .h50, .h100, .h200, .h300, .h400, .h500, .h600, .h700) {
          color: var(--text-secondary);
     }
     /* The large logo comes in a light and a dark version (brand/large-logo.svg, large-logo-dark.svg); the page holds both. */
     .logo-dark { display: none; }
     :root.theme-dark .logo-light { display: none; }
     :root.theme-dark .logo-dark { display: inline; }
</style>
<style>
     /* Language tabsets: <div class="tabset"><div class="tab" data-lang="Scala">...</div>...</div>; see WORKLOG-tutorial-tabs.md */
     .tabset { margin: 1em 0; }
     .tabset > .tab-bar { display: flex; gap: 0.25em; border-bottom: 1px solid var(--text-primary); }
     .tabset > .tab-bar > button { background: none; border: 1px solid transparent; border-bottom: none; padding: 0.3em 0.9em; cursor: pointer; color: var(--text-primary); font: inherit; }
     .tabset > .tab-bar > button[aria-selected="true"] { border-color: var(--text-primary); background: var(--background-subtle); font-weight: bold; }
     .tabset.js-ready > .tab:not(.active) { display: none; }
     .tabset > .tab > *:first-child { margin-top: 0.5em; }
     div.mermaid { overflow-x: auto; margin: 1em 0; }
</style>
<script>
     // Builds a tab bar for each .tabset from its .tab children's data-lang, and keeps every tabset on the page (and on later pages) on the same language.
     document.addEventListener("DOMContentLoaded", function () {
          var KEY = "tda4j-language";
          var saved = null;
          try { saved = localStorage.getItem(KEY); } catch (e) {}
          var sets = Array.prototype.slice.call(document.querySelectorAll(".tabset"));
          function show(lang) {
               sets.forEach(function (set) {
                    var tabs = Array.prototype.slice.call(set.children).filter(function (c) { return c.classList.contains("tab"); });
                    var chosen = tabs.some(function (t) { return t.dataset.lang === lang; }) ? lang : tabs[0].dataset.lang;
                    tabs.forEach(function (t) { t.classList.toggle("active", t.dataset.lang === chosen); });
                    set.querySelectorAll(".tab-bar > button").forEach(function (b) { b.setAttribute("aria-selected", b.textContent === chosen ? "true" : "false"); });
               });
          }
          sets.forEach(function (set) {
               var bar = document.createElement("div");
               bar.className = "tab-bar";
               bar.setAttribute("role", "tablist");
               Array.prototype.slice.call(set.children).filter(function (c) { return c.classList.contains("tab"); }).forEach(function (t) {
                    var b = document.createElement("button");
                    b.type = "button";
                    b.setAttribute("role", "tab");
                    b.textContent = t.dataset.lang;
                    b.addEventListener("click", function () {
                         try { localStorage.setItem(KEY, t.dataset.lang); } catch (e) {}
                         show(t.dataset.lang);
                    });
                    bar.appendChild(b);
               });
               set.insertBefore(bar, set.firstChild);
               set.classList.add("js-ready");
          });
          show(saved);
     });
</script>
<script>
     // Mermaid diagrams. Scaladoc renders a ```mermaid fence as <pre><code class="language-mermaid">, which mermaid does not
     // pick up by itself. On a page that has one, load mermaid (pinned; only there, it is 2.5 MB) and draw each block in
     // the site's light or dark theme, redrawing when the reader switches. If the script cannot load, the source stays.
     document.addEventListener("DOMContentLoaded", function () {
          var codes = Array.prototype.slice.call(document.querySelectorAll("pre > code.language-mermaid"));
          if (!codes.length) return;
          var script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js";
          script.onload = function () {
               var diagrams = codes.map(function (code) {
                    var div = document.createElement("div");
                    div.className = "mermaid";
                    div.dataset.source = code.textContent;
                    code.parentNode.replaceWith(div);
                    return div;
               });
               var drawnDark = null;
               function draw() {
                    var dark = document.documentElement.classList.contains("theme-dark");
                    if (dark === drawnDark) return;
                    drawnDark = dark;
                    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" });
                    diagrams.forEach(function (d) {
                         d.removeAttribute("data-processed");
                         d.textContent = d.dataset.source;
                    });
                    // Mermaid scales a diagram down to the column, which makes a wide one unreadable (its useMaxWidth setting
                    // does not reach class diagrams). Shrink to fit only down to 70% of natural size; wider than that, keep
                    // 70% and scroll sideways.
                    mermaid.run({ nodes: diagrams }).then(function () {
                         diagrams.forEach(function (d) {
                              var svg = d.querySelector("svg");
                              var box = svg && svg.viewBox && svg.viewBox.baseVal;
                              if (!box || !box.width) return;
                              var width = Math.max(Math.min(box.width, d.clientWidth), 0.7 * box.width);
                              svg.style.maxWidth = "none";
                              svg.setAttribute("width", width);
                              svg.setAttribute("height", box.height * width / box.width);
                         });
                    });
               }
               draw();
               new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
          };
          document.head.appendChild(script);
     });
</script>
<main>
     {{ content }}
</main>
